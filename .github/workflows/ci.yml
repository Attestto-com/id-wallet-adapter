name: CI

# Every branch, not just `main`/`develop`. With `branches: [main, develop]` on
# both triggers, a pull request whose base was any other branch (a stacked PR)
# matched no trigger at all, so the job never queued and every step below was
# skipped rather than failed: the cheapest possible way to disable an entire
# pipeline without touching a single step.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Lint · Test · Coverage · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Changelog gate
        run: node scripts/ci-changelog.mjs

      - name: Install dependencies
        run: npm ci

      # First gate after install: seeds a real violation for each gate below and
      # requires a red, so a passing pipeline is evidence rather than decoration.
      - name: Gate self-test
        run: npm run gate-self-test

      - name: Stub guard
        run: |
          PATTERNS=(
            "// *(TODO|FIXME|HACK|XXX|PLACEHOLDER|placeholder)"
            "did:(web|example):demo"
            "did:(web|example):medico|did:example:"
            "['\"]fake[_-]|['\"]dummy[_-]|['\"]sample[_-]"
            "alert\(['\"]"
            "coming.?soon|próximamente|proximamente"
            "not yet implemented|not implemented"
            "'00000'|\"00000\""
          )
          EXCLUDE="node_modules/\|/dist/\|__tests__/\|__mocks__/\|/demo/\|/scripts/\|/fixtures/\|\.test\.\|\.spec\.\|vitest\.\|jest\."
          INCLUDE='\.ts:\|\.tsx:\|\.vue:\|\.js:\|\.mjs:'
          ALLOW='stub-guard-ignore\|/i18n/\|/locales/\|@example\|/\*\*\|^ *\*'
          HITS=0
          for pat in "${PATTERNS[@]}"; do
            matches=$(grep -rEn -i "$pat" src 2>/dev/null | grep "$INCLUDE" | grep -v "$EXCLUDE" | grep -v "$ALLOW" || true)
            if [ -n "$matches" ]; then
              echo "$matches"
              HITS=$((HITS + $(echo "$matches" | wc -l)))
            fi
          done
          if [ "$HITS" -gt 0 ]; then
            echo "::error::Stub guard failed: $HITS stub(s) found"
            exit 1
          fi
          echo "Stub guard passed"

      - name: Type-check (lint)
        run: npm run lint

      # `test:run`, never `npm test`: the bare `test` script is `vitest`, which
      # is watch mode and would hang the runner instead of reporting anything.
      - name: Run tests
        run: npm run test:run

      - name: Coverage (must meet thresholds in vitest.config.ts)
        run: npm run coverage

      - name: Build
        run: npm run build
